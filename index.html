<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Tool</title>
    <meta name="theme-color" content="#007aff">
    <script>
        try {
            const theme = localStorage.getItem("dt-theme");
            if (theme === "light" || theme === "dark") {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) {
            // Keep the system theme if storage is unavailable.
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="title-block">
            <div>
                <h1>Diff Tool</h1>
                <p class="subtle">Compare text side by side in your browser.</p>
            </div>
            <div class="buttons" aria-label="Diff actions">
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
                <button id="clearBtn" class="btn btn-secondary" type="button">Clear</button>
                <button id="swapBtn" class="btn btn-secondary" type="button">Swap</button>
                <button id="findDiffBtn" class="btn btn-primary" type="button">Find Difference</button>
            </div>
        </header>

        <section class="input-section" aria-label="Text inputs">
            <div class="input-panel">
                <label class="panel-header" for="text1">Original Text</label>
                <textarea id="text1" placeholder="Paste or type the original text here..."></textarea>
            </div>
            <div class="input-panel">
                <label class="panel-header" for="text2">Changed Text</label>
                <textarea id="text2" placeholder="Paste or type the changed text here..."></textarea>
            </div>
        </section>

        <section class="normalize-section" id="normalizeSection" aria-live="polite">
            <div class="normalize-info">
                <span class="format-badge" id="formatBadge">JSON</span>
                Structured data detected. Sort keys before comparing?
            </div>
            <button id="normalizeBtn" class="btn-normalize" type="button">Normalize & Compare</button>
        </section>

        <section class="summary" id="summary" aria-live="polite" hidden>
            <div class="summary-classification" id="summaryClassification"></div>
            <div class="summary-detail" id="summaryDetail"></div>
        </section>

        <section class="stats" id="stats" aria-label="Diff statistics" hidden>
            <div class="stat stat-removed">
                <span aria-hidden="true">-</span>
                <span id="removedCount">0</span> removed
            </div>
            <div class="stat stat-added">
                <span aria-hidden="true">+</span>
                <span id="addedCount">0</span> added
            </div>
            <div class="stat stat-modified">
                <span aria-hidden="true">~</span>
                <span id="modifiedCount">0</span> modified
            </div>
            <span class="stat-separator" aria-hidden="true">|</span>
            <div class="stat stat-unchanged">
                <span id="unchangedCount">0</span> unchanged
            </div>
            <span class="stat-separator" aria-hidden="true">|</span>
            <div class="stat">
                <span id="percentChanged">0</span>% changed
            </div>
        </section>

        <section class="diff-section" id="diffSection" aria-label="Diff output" hidden>
            <div class="diff-panel">
                <div class="diff-header">
                    <span class="diff-title">Original</span>
                </div>
                <div class="diff-content" id="diff1" tabindex="0"></div>
            </div>
            <div class="diff-panel">
                <div class="diff-header">
                    <span class="diff-title">Changed</span>
                </div>
                <div class="diff-content" id="diff2" tabindex="0"></div>
            </div>
        </section>
    </main>

    <script src="diff.js"></script>
</body>
</html>
